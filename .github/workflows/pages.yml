name: Deploy GitHub Pages

on:
  release:
    types: [published]
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Determine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          fi

      - name: Download latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data

          echo "Downloading release: $RELEASE_TAG"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "bamf_questions.json" \
            --pattern "bamf_images.zip" \
            --dir site/data \
            --clobber

          test -f site/data/bamf_questions.json
          test -f site/data/bamf_images.zip

          echo "Release assets downloaded successfully:"
          ls -lh site/data/

      - name: Create release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,publishedAt,name \
            > site/data/release.json

          cat site/data/release.json

      - name: Prepare website
        run: |
          cp index.html site/index.html
          cp app.js site/app.js

          if [ -f style.css ]; then
            cp style.css site/style.css
          fi

          if [ -f styles.css ]; then
            cp styles.css site/styles.css
          fi

          touch site/.nojekyll

          echo "Pages site contents:"
          find site -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4